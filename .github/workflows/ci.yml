name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install and test
        run: |
          uv sync
          uv run pytest -q
        env:
          DAQ_MCP_SIMULATE: "1"
