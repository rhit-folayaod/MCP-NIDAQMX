[project]
name = "daq-mcp"
version = "0.1.0"
description = "MCP server that exposes NI DAQ hardware to AI coding clients"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "rhit-folayaod", email = "folayaod@rose-hulman.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
]

[project.optional-dependencies]
hardware = [
    "nidaqmx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/JS in the dashboard HTML string routinely exceeds 100 cols.
"src/daq_mcp/dashboard.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
